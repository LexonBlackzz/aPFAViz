plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Optional local release signing. Copy keystore.properties.example to
// keystore.properties and fill it in; the real file and keystore stay out of Git.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.apfa'
    compileSdk 34
    // Keep the proven native toolchain for now. The app itself now targets
    // Android 6.0+ so the UI can use the modern platform APIs without carrying
    // Gingerbread/pre-SAF compatibility code.
    ndkVersion '21.4.7075529'

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId 'com.apfa'
        // Android 6.0 (Marshmallow). This deliberately drops the legacy
        // Gingerbread/pre-SAF UI paths and gives the shell a clean modern floor.
        minSdk 23
        targetSdk 34
        versionCode 17
        versionName '1.3.1'

        // arm64-v8a for modern phones; armeabi-v7a for budget devices whose
        // 64-bit-capable SoC shipped with a 32-bit OS (e.g. LG X410 / SD425).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // Build the native engine (libapfa.so) via CMake.
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Pack the prebuilt BASS / BASSMIDI .so files into the APK.
    sourceSets {
        main.jniLibs.srcDirs += ['../bass24-android/libs', '../bassmidi24-android/libs']
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                logger.lifecycle('Release signing disabled: create keystore.properties to produce a signed APK.')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}